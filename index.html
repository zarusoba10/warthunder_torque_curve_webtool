<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access is needed: everything is inline. Blocks external loads/exfiltration even if markup were ever injected. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>WarThunder 車両性能ツール / WarThunder Vehicle Performance Tool</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --panel:#f4f6f8; --text:#17202a; --muted:#596579; --border:#d7dde5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --panel:#1f2937; --text:#f3f4f6; --muted:#aab4c4; --border:#374151; --accent:#60a5fa; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1200px; margin:auto; }
  h1 { font-size:1.65rem; margin:0 0 6px; }
  .lead,.muted { color:var(--muted); }
  .lead { margin:0 0 22px; }
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .engines { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:0; }
  .card h2 { font-size:1.05rem; margin:0 0 12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 4px; }
  input,select,button { font:inherit; }
  input,select { width:100%; min-width:0; padding:9px 10px; border:1px solid var(--border); border-radius:7px; color:var(--text); background:var(--bg); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0 12px; }
  button { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:9px 13px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab { border-bottom:none; border-radius:8px 8px 0 0; padding:9px 18px; color:var(--muted); }
  .tab.active { background:var(--bg); color:var(--accent); font-weight:600; border-bottom:2px solid var(--bg); margin-bottom:-1px; }
  .chart-card { margin-top:18px; padding:16px; border:1px solid var(--border); border-radius:12px; }
  .chart-wrap { position:relative; width:100%; height:440px; }
  .chart-wrap.tall { height:auto; aspect-ratio:5/6; }
  .pinputs { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .pcharts { display:grid; grid-template-columns:1fr; max-width:600px; margin:0 auto; gap:18px; }
  .pcharts.two { grid-template-columns:1fr 1fr; max-width:none; }
  .xh { position:absolute; pointer-events:none; z-index:2; }
  .xv { width:0; border-left:1px dashed var(--muted); }
  .xhz { height:0; border-top:1px dashed var(--muted); }
  .chart-wrap canvas { cursor:none; }   /* hide the mouse pointer over charts (the crosshair shows the position) */
  .zoom-reset { position:absolute; left:4px; top:2px; z-index:4; width:24px; height:24px; padding:0; display:none; align-items:center; justify-content:center; border-radius:6px; opacity:.92; }
  .zoom-reset:hover { opacity:1; border-color:var(--accent); color:var(--accent); filter:none; }
  .chart-tip { position:absolute; pointer-events:none; z-index:3; min-width:140px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; line-height:1.55; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .chart-tip div { display:flex; justify-content:space-between; gap:14px; }
  .chart-tip span { color:var(--muted); }
  .chart-tip b { font-variant-numeric:tabular-nums; }
  .ppanel { min-width:0; }
  .pcharts.overlay #pPanel1 .chart-wrap { display:none; }
  @media(max-width:760px) { .pcharts.two { grid-template-columns:1fr; max-width:600px; } }
  canvas { width:100%; height:100%; display:block; }
  .chart-wrap.tall canvas { position:absolute; inset:0; }
  .results { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:14px; }
  .result { border:1px solid var(--border); border-radius:9px; padding:11px 12px; }
  .result strong { display:block; margin-bottom:4px; }
  .result small { color:var(--muted); display:block; }
  .error { color:#dc2626; font-size:.85rem; min-height:1.3em; }
  details { margin-top:16px; color:var(--muted); }
  code { background:var(--panel); padding:2px 5px; border-radius:4px; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0 0; color:var(--muted); font-size:.9rem; }
  .swatch { display:inline-block; width:17px; height:4px; border-radius:4px; vertical-align:middle; margin-right:6px; }
  .chart-options { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin:12px 0 4px; }
  .chart-options label { display:flex; align-items:center; gap:7px; margin:0; color:var(--text); cursor:pointer; }
  .chart-options input { width:auto; accent-color:var(--accent); }
  .line-key { display:inline-block; width:24px; border-top:3px solid currentColor; vertical-align:middle; margin-right:6px; }
  .line-key.dashed { border-top-style:dashed; }
  .config-box { margin:0 0 12px; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
  .config-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .config-head label { margin:0 0 5px; }
  .config-box textarea { display:block; width:100%; min-height:76px; resize:vertical; padding:8px 9px; border:1px solid var(--border); border-radius:7px; color:var(--text); background:var(--bg); font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; }
  .config-box button { padding:5px 9px; font-size:.8rem; }
  .config-status { min-height:1.2em; margin-top:4px; color:var(--muted); font-size:.78rem; }
  .config-status.ok { color:#15966b; }
  .config-status.bad { color:#dc2626; }
  .phead { text-align:center; margin:10px 0 6px; }
  .phead .vn { font-size:1.25rem; font-weight:700; }
  @media(max-width:600px) { body { padding:14px; } .chart-wrap { height:340px; } }

  .acharts { display:grid; grid-template-columns:1fr; max-width:600px; margin:0 auto; gap:18px; }
  .acharts.two { grid-template-columns:1fr 1fr; max-width:none; }
  .acol { min-width:0; }
  .chart-wrap.acc { height:auto; aspect-ratio:1.1/1; margin-bottom:12px; }
  .chart-wrap.acc canvas { position:absolute; inset:0; }
  .acharts.overlay #aCol1 .chart-wrap { display:none; }
  @media(max-width:760px) { .acharts.two { grid-template-columns:1fr; max-width:600px; } }

  /* ---- app header / shared inputs (compact) ---- */
  .apphead { display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin-bottom:10px; }
  .apphead h1 { margin:0; font-size:1.4rem; }
  .apphead .toolbar { margin:0; gap:10px; }
  .apphead .toolbar button { padding:5px 10px; font-size:.85rem; }
  h2.tabtitle { font-size:1.2rem; margin:0 0 4px; }
  .tabs { margin:14px 0 16px; }
  .pmore { margin:8px 0 0; }
  .pmore summary { cursor:pointer; color:var(--muted); font-size:.85rem; }
  .error { min-height:0; margin:4px 0; }
  .lead { margin:0 0 10px; }
  .titlebox { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .helpbtn { padding:5px 12px; font-size:.85rem; border-radius:999px; }
  .modal { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.45); }
  .modal-box { position:relative; width:100%; max-width:560px; max-height:85vh; overflow:auto; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:20px 24px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .modal-box h2 { margin:0 0 10px; font-size:1.15rem; padding-right:34px; }
  .modal-box li { margin:0 0 8px; }
  .modal-x { position:absolute; top:10px; right:12px; width:32px; height:32px; padding:0; font-size:1.4rem; line-height:1; border-radius:50%; }
  .help-note { margin:12px 0 0; padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel); border-radius:4px; }
  .chart-wrap.eng { height:auto; aspect-ratio:1.2/1; }
  .chart-wrap.eng canvas { position:absolute; inset:0; }
  .pcharts.overlay #ePanel1 .chart-wrap { display:none; }
</style>
</head>
<body>
<main>
  <header class="apphead">
    <div class="titlebox"><h1 data-i18n="appTitle"></h1><button type="button" id="helpBtn" class="helpbtn" data-i18n="help"></button></div>
    <div class="toolbar">
      <button id="reset" data-i18n="reset"></button>
      <button id="shareBtn" type="button" data-i18n="share"></button>
      <label style="margin:0"><span data-i18n="powerUnit"></span>
        <select id="powerUnit" style="width:auto;display:inline-block;margin-left:6px">
          <option value="hp">HP</option>
          <option value="ps">PS</option>
          <option value="kw">kW</option>
        </select>
      </label>
      <label style="margin:0">Language / 言語
        <select id="language" aria-label="Language" style="width:auto;display:inline-block;margin-left:6px">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </header>

  <div class="modal" id="helpModal" hidden role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="modal-box">
      <button type="button" class="modal-x" id="helpClose" aria-label="Close">&times;</button>
      <h2 id="helpTitle" data-i18n="helpTitle"></h2>
      <ol>
        <li data-i18n="helpS1"></li>
        <li data-i18n="helpS2"></li>
        <li data-i18n="helpS3"></li>
      </ol>
      <p class="help-note" data-i18n="helpNote"></p>
    </div>
  </div>

  <!-- ===== Shared inputs (used by every tool) ===== -->
  <section class="pinputs" id="pInputs"></section>

  <section class="matbox" style="margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px">
    <label style="margin:0"><span data-i18n="material"></span>
      <select id="material" style="width:auto;display:inline-block;margin-left:6px">
        <option value="soil">soil</option>
        <option value="road">road</option>
      </select>
    </label>
    <small class="muted" id="matInfo"></small>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="torque" data-i18n="tabTorque"></button>
    <button class="tab" role="tab" data-tab="perf" data-i18n="tabPerf"></button>
    <button class="tab" role="tab" data-tab="acc" data-i18n="tabAcc"></button>
  </nav>

  <!-- ===== Tab 1: Torque curves ===== -->
  <section id="tab-torque">
    <h2 class="tabtitle" data-i18n="title"></h2>
    <p class="lead" data-i18n="lead"></p>
    <p class="error" id="error" role="status"></p>

    <section class="chart-card">
      <div class="muted" style="font-size:.85rem" data-i18n="chartDescription"></div>
      <div class="chart-options">
        <label><input type="checkbox" id="showTorque" checked> <span data-i18n="torqueLine"></span></label>
        <label><input type="checkbox" id="showPower" checked> <span data-i18n="powerLine"></span></label>
        <label><input type="checkbox" id="absAxis"> <span data-i18n="absAxis"></span></label>
        <label><input type="checkbox" id="eOverlay"> <span data-i18n="eOverlay"></span></label>
      </div>
      <div class="pcharts" id="eCharts">
        <div class="ppanel" id="ePanel0" hidden>
          <div class="phead" id="eHead0"></div>
          <div class="chart-wrap eng"><canvas id="chart0" role="img" data-aria="ariaTorque"></canvas></div>
          <div class="legend" id="eLegend0" style="justify-content:center"></div>
          <div class="results" id="eResults0"></div>
        </div>
        <div class="ppanel" id="ePanel1" hidden>
          <div class="phead" id="eHead1"></div>
          <div class="chart-wrap eng"><canvas id="chart1" role="img" data-aria="ariaTorque"></canvas></div>
          <div class="legend" id="eLegend1" style="justify-content:center"></div>
          <div class="results" id="eResults1"></div>
        </div>
      </div>
    </section>

    <details>
      <summary data-i18n="modelSummary"></summary>
      <p data-i18n="modelP1"></p>
      <p data-i18n="modelP2"></p>
      <p data-i18n="modelP3"></p>
      <p data-i18n="modelP4"></p>
      <p data-i18n="modelP6"></p>
    </details>
  </section>

  <!-- ===== Tab 2: Performance curves ===== -->
  <section id="tab-perf" hidden>
    <h2 class="tabtitle" data-i18n="pTitle"></h2>
    <p class="lead" data-i18n="pLead"></p>

    <p class="error" id="pError" role="status"></p>

    <section class="chart-card">
      <div class="chart-options" style="justify-content:center">
        <label><input type="checkbox" id="showCurves" checked> <span data-i18n="showCurves"></span></label>
        <label><input type="checkbox" id="showLines" checked> <span data-i18n="showLines"></span></label>
        <label><input type="checkbox" id="showPCurve"> <span data-i18n="showPCurve"></span></label>
        <label><input type="checkbox" id="showDrag" checked> <span data-i18n="showDrag"></span></label>
        <label><input type="checkbox" id="showOverlay"> <span data-i18n="showOverlay"></span></label>
      </div>
      <div class="pcharts" id="pCharts">
        <div class="ppanel" id="pPanel0" hidden>
          <div class="phead" id="pHead0"></div>
          <div class="chart-wrap tall"><canvas id="pChart0" role="img" data-aria="ariaPerf"></canvas></div>
          <div class="legend" id="pLegend0" style="justify-content:center"></div>
          <div class="results" id="pResults0"></div>
        </div>
        <div class="ppanel" id="pPanel1" hidden>
          <div class="phead" id="pHead1"></div>
          <div class="chart-wrap tall"><canvas id="pChart1" role="img" data-aria="ariaPerf"></canvas></div>
          <div class="legend" id="pLegend1" style="justify-content:center"></div>
          <div class="results" id="pResults1"></div>
        </div>
      </div>
    </section>

    <details>
      <summary data-i18n="pModelSummary"></summary>
      <p data-i18n="pM1"></p>
      <p data-i18n="pM2"></p>
      <p data-i18n="pM3"></p>
      <p data-i18n="pM4"></p>
      <p data-i18n="pM5"></p>
      <p data-i18n="modelP6"></p>
    </details>
  </section>

  <!-- ===== Tab 3: Acceleration curves ===== -->
  <section id="tab-acc" hidden>
    <h2 class="tabtitle" data-i18n="aTitle"></h2>
    <p class="lead" data-i18n="aLead"></p>
    <p class="error" id="aError" role="status"></p>
    <section class="chart-card">
      <div class="chart-options" style="justify-content:center">
        <label><span data-i18n="accSlope"></span>
          <select id="accSlope" style="width:auto"><option value="0">0%</option><option value="2">2%</option><option value="5">5%</option><option value="7">7%</option><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option><option value="25">25%</option><option value="30">30%</option></select></label>
        <label><input type="checkbox" id="aOverlay"> <span data-i18n="aOverlay"></span></label>
        <label><input type="checkbox" id="aShowV" checked> <span data-i18n="aShowV"></span></label>
        <label><input type="checkbox" id="aShowD" checked> <span data-i18n="aShowD"></span></label>
        <label><span data-i18n="aLag"></span> <input type="number" id="accLag" value="0.3" min="0" step="any" style="width:80px"></label>
      </div>
      <div class="acharts" id="aCharts">
        <div class="acol" id="aCol0" hidden>
          <div class="phead" id="aHead0"></div>
          <div class="chart-wrap acc"><canvas id="aV0" role="img" data-aria="ariaAcc"></canvas></div>
          <div class="legend" id="aLeg0" style="justify-content:center"></div>
          <div class="results" id="aRes0"></div>
        </div>
        <div class="acol" id="aCol1" hidden>
          <div class="phead" id="aHead1"></div>
          <div class="chart-wrap acc"><canvas id="aV1" role="img" data-aria="ariaAcc"></canvas></div>
          <div class="legend" id="aLeg1" style="justify-content:center"></div>
          <div class="results" id="aRes1"></div>
        </div>
      </div>
    </section>
    <details>
      <summary data-i18n="aModelSummary"></summary>
      <p data-i18n="aM1"></p><p data-i18n="aM2"></p><p data-i18n="aM3"></p>
    </details>
  </section>
</main>
<!--
==========================================================================
 開発メモ（Claude 向け）: 路面材質パラメータと、未実装の計算要素
 ※ このブロックはメモのみ。コードからは参照されていない。
==========================================================================

【出典】
 - War Thunder の physmat.blk (JSON化されたもの)
     PhysMats.<材質>.resistanceK                            速度比例抗力の係数
     InteractPropsList.tankTrack.<材質>.{fk, rollingFrictionK}   履帯 x 材質
     InteractPropsList.wheel.<材質>.{fk, rollingFrictionK}       車輪 x 材質
 - DagorEngine (GitHub: GaijinEntertainment/DagorEngine)
     samples/dngSceneViewer/prog/gameBase/config/physmat.blk  冒頭の式の注釈
     prog/engine/scene/physMat.cpp   fk -> frict_k, rollingFrictionK -> rollingFric_k を読むだけ
     prog/gameLibs/vehiclePhys/rayCar.cpp, prog/engine/phys/physCommon/physRayCarBase_impl.h
                                       車輪(ray car)の摩擦計算。fk を摩擦の上限として使用
   ※ rollingFric_k は公開コード内のどこでも使われていない。戦車の履帯の牽引力・抵抗の計算は
     非公開のゲーム本体側にあり、公開コードからは分からない。

【材質パラメータ】  (ソース: physmat.blk)
  rK = PhysMats の resistanceK ('-' は材質に記載なし)
  fk = 摩擦の倍率 / roll = rollingFrictionK
  材質               rK        | 履帯fk  履帯roll | 車輪fk  車輪roll
  default            2.5e-05   | 1     0.055   | 1     0.045  
  steel              -         | 1     0.1     | 0.6   0.02   
  horLandMesh        0.0006    | 1     0.1     | 1     0.2    
  soil               2.5e-05   | 1     0.055   | 1     0.045  
  steppe             2.5e-05   | 1     0.055   | 1     0.045  
  dirt               0.001     | 0.85  0.08    | 0.8   0.2    
  road               -         | 0.9   0.05    | 1     0.0166 
  roadSoil           -         | 1     0.055   | 1     0.0172 
  bricks_red         0.00035   | 0.8   0.05    | 0.8   0.0166 
  concrete           -         | 0.95  0.05    | 0.95  0.0166 
  sand               2.5e-05   | 0.9   0.06    | 0.95  0.0475 
  duneSand           2.5e-05   | 0.8   0.06    | 0.95  0.0475 
  roadSand           -         | 0.9   0.06    | 1     0.0177 
  snow               2.5e-05   | 0.9   0.06    | 0.9   0.0475 
  ice                -         | 0.1   0.045   | 0.15  0.02   
  football_ramp      -         | 0.3   0.2     | 0.35  0.25   
  roadSnow           -         | 0.9   0.06    | 0.95  0.0177 
  rocks              -         | 0.75  0.05    | 0.7   0.07   
  rocksSlippery      -         | 0.7   0.07    | 0.65  0.09   
  rocksSlipperyHigh  -         | 0.2   0.04    | 0.25  0.04   
  fabric             0.00035   | 0.8   0.09    | 0.8   0.15   
  glass              0.00035   | 0.6   0.02    | 0.6   0.02   
  stone_snow         0.00035   | 0.75  0.05    | 0.7   0.07   
  metal              0.00035   | 0.6   0.02    | 0.6   0.02   
  transparentMetal   0.00035   | 1     0.1     | 0.6   0.02   
  wood               0.00035   | 0.8   0.0166  | 0.8   0.01   
  stone              0.00035   | 0.75  0.05    | 0.75  0.07   
  ceramic            0.00035   | 0.6   0.05    | 0.6   0.07   
  rubber             0.00035   | 0.8   0.09    | 0.8   0.15   
  paper              0.00035   | 0.8   0.09    | 0.8   0.15   

  * InteractPropsList に無い材質 (quickSand, snowLower, soil_brown など) は default の値を使う想定 (仮定)。
  * rK が '-' の材質は default の 0.000025 を仮定 (未確認)。
  * PhysMats 側にも fk (0.65) と frictionMultiplier (default 1.0, horLandMesh 4.0, water 2.0) を持つ
    材質があるが、履帯/車輪の牽引力にどう効くかは不明。上の表には含めていない。
  * 現在のツールの転がり抵抗: 路面マテリアル切替 (soil: 履帯 0.055 / 車輪 0.045, road: 履帯 0.05 / 車輪 0.0166)。rK は両方 2.5e-5 (road の rK は表に無いため default を仮定)。fk は無視。
    default 履帯は 0.055, default 車輪は 0.045。

【実装済み(rK=2.5e-5・resistanceMult=1 固定): 速度比例抗力】
  式 (physmat.blk の注釈):  係数 C(v) = rollingFrictionK + resistanceMult * resistanceK * v^2
   - resistanceMult : 車両(履帯)側の倍率。値は不明 (既定 1 と仮定)

    const side = m.sideGearRatio === undefined ? 1 : Number(m.sideGearRatio);
    return {
      vname: asText(d.model), ename: e.name, power: e.power, rpm: e.rpm, minRpm: e.minRpm, a: e.a, b: e.b, c: e.c,
      gears: g.map(Number).filter(v => v > 0).join(", "),
      final: m.mainGearRatio === undefined ? "" : fmtNum(Number(m.mainGearRatio) * side), radius: asText(m.driveGearRadius),
      mass: (() => { const M = find(d, "Mass") || {}; return M.Empty !== undefined ? fmtNum(Number(M.Empty) + Number(M.Fuel || 0)) : asText(M.TakeOff ?? d.mass); })(), inertia: inertiaOf(asText((find(d, "Mass") || {}).trackMass), asText((find(d, "Mass") || {}).engineInertialMass)), phys: asText((find(d, "tracks") || {}).trackPhysMat)
    };
  }

  pCards.forEach((card, i) => {
    const pText = card.querySelector(".pText");
    pText.addEventListener("input", () => {
      if (!pText.value.trim()) { pfStat[i] = {fn: () => tr("pHint"), cls: ""}; renderPfStat(i); return; }
      try {
        const p = parseVehicleConfig(pText.value);
        PFK.forEach(k => { pfField(i,k).value = p[k] ?? ""; });
        pPhys[i] = p.phys || "";
        const missing = [];
        if (p.power === "") missing.push(tr("missingPower"));
        if (p.rpm === "") missing.push(tr("missingRPM"));
        if (p.minRpm === "") missing.push(tr("missingMin"));
        if (p.gears === "") missing.push(tr("missingGears"));
        if (p.final === "") missing.push(tr("missingFinal"));
        if (p.radius === "") missing.push(tr("missingRadius"));
        if (p.mass === "") missing.push(tr("missingMass"));
        const noFormula = p.a === "" && p.b === "" && p.c === "";
        const label = p.vname || p.ename;
        pfStat[i] = missing.length
          ? {fn: () => `${tr("statusLoaded")}${missing.join(", ")}`, cls: "bad"}
          : {fn: () => `${tr("statusSuccess")}${label}${noFormula ? tr("statusDefault") : ""}`, cls: "ok"};
        renderPfStat(i);
        refresh();
      } catch (err) {
        pfStat[i] = {fn: () => `${tr("statusError")}${err.message}`, cls: "bad"}; renderPfStat(i);
      }
    });
    card.querySelector(".pClear").addEventListener("click", () => {
      pText.value = ""; PFK.forEach(k => pfField(i,k).value = ""); pPhys[i] = "";
      pfStat[i] = {fn: () => tr("statusCleared"), cls: ""}; renderPfStat(i); refresh();
    });
    card.querySelectorAll("[data-pk]").forEach(el => el.addEventListener("input", refresh));
  });
  showCurves.addEventListener("change", updatePerf);
  showLines.addEventListener("change", updatePerf);
  showPCurve.addEventListener("change", updatePerf);
  showDrag.addEventListener("change", updatePerf);
  showOverlay.addEventListener("change", updatePerf);

  function calcPerf(i) {
    const r = readPerf(i);
    if (["power","rpm","minRpm","gears","final","radius","a","b","c"].every(k => r[k].trim() === "")) return null;
    const power = Number(r.power), rpm = Number(r.rpm), minRpm = Number(r.minRpm);
    if (r.power === "" || r.rpm === "" || r.minRpm === "" || !(power > 0 && rpm > 0 && minRpm >= 0 && minRpm < rpm)) return {error: tr("pErrEngine")};
    const blank = ["a","b","c"].filter(k => r[k] === "").length;
    if (blank === 1 || blank === 2) return {error: tr("pErrCoef")};
    const usedDefault = blank === 3;
    const co = usedDefault ? DEFAULT_CURVE : {a:Number(r.a), b:Number(r.b), c:Number(r.c)};
    if (![co.a,co.b,co.c].every(Number.isFinite)) return {error: tr("pErrCoef")};
    const gears = r.gears.split(/[\s,;、，]+/).filter(Boolean).map(Number);
    if (!gears.length || !gears.every(g => Number.isFinite(g) && g > 0)) return {error: tr("pErrGears")};
    const fin = Number(r.final), rad = Number(r.radius);
    if (!(r.final !== "" && fin > 0)) return {error: tr("pErrFinal")};
    if (!(r.radius !== "" && rad > 0)) return {error: tr("pErrRadius")};
    const mass = r.mass.trim() === "" ? null : Number(r.mass);
    if (mass !== null && !(mass > 0 && Number.isFinite(mass))) return {error: tr("pErrMass")};

    const xmin = minRpm/rpm;
    const fc = x => { const t = Math.max(x, xmin); return Math.max(1, co.a*t*t + co.b*t + co.c); };
    let factor = 0;
    for (let k=0; k<=4000; k++) { const x = k/4000; factor = Math.max(factor, x*fc(x)); }
    if (!(factor > 0)) return {error: tr("pErrFactor")};
    const base = power*UNIT_W.hp / (RAD*rpm*factor);   // N·m
    if (!Number.isFinite(base)) return {error: tr("pErrRange")};   // e.g. 1e308 inputs overflow

    const gs = gears.map((g, gi) => {
      const tot = g*fin, k = RAD*rad/tot*3.6;                          // k: km/h per RPM
      const data = [], N = 120;
      for (let j=0; j<=N; j++) {
        const n = minRpm + (rpm-minRpm)*j/N;
        data.push({rpm:n, v:k*n, f:base*fc(n/rpm)*tot/rad/1000});      // kN
      }
      const pk = data.reduce((b,p) => p.f > b.f ? p : b, data[0]);
      return {n:gi+1, g, tot, k, data, pk, vmax:k*rpm};
    });
    // Overflow/underflow guard (extreme inputs such as 1e308 would otherwise produce Infinity/NaN in the charts)
    if (!gs.every(g => [g.tot, g.k, g.vmax, g.pk.f].every(Number.isFinite) && g.vmax > 0 && g.pk.f > 0)) return {error: tr("pErrRange")};
    const mat = MATS[matSel.value], crr = (pPhys[i] || "").trim().toLowerCase() === "wheel" ? mat.wheel : mat.track, rk = mat.rk;
    const drag = mass ? SLOPES.map(sl => { const th = Math.atan(sl/100); return {s: sl, f: mass*G*(Math.sin(th) + crr*Math.cos(th))/1000, q: mass*G*Math.cos(th)*rk/1000}; }) : null;   // f: kN at v=0, q: kN per (m/s)^2
    gs.forEach(g => {   // slope where resistance equals peak traction: sinθ + Crr·cosθ = F/(m·g)
      const ce = crr + rk*Math.pow(g.pk.v/3.6, 2);   // effective Crr at the peak-traction speed
      g.climb = mass ? Math.asin(Math.min(1, g.pk.f*1000/(mass*G)/Math.hypot(1, ce))) - Math.atan(ce) : null;
    });
    return {idx:i, vname:r.vname.trim(), ename:r.ename.trim(), base, fc, rad, crr, rk, extraM: Number(r.inertia) > 0 ? Number(r.inertia) : 0, gs, rpm, minRpm, usedDefault, pW: power*UNIT_W.hp, mass, drag};
  }

  // ax: shared axis tops {v, r, f} (theoretical max x 1.1); nc: gear count used for the colour palette
  function drawPerf(cv, list, ax, nc) {
    cv._redraw = () => drawPerf(cv, list, ax, nc);
    const c = cv.getContext("2d"), rect = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (rect.width < 10) return;
    cv.width = Math.round(rect.width*dpr); cv.height = Math.round(rect.height*dpr);
    c.setTransform(dpr,0,0,dpr,0,0);
    const w = rect.width, h = rect.height;
    c.clearRect(0,0,w,h);
    cv._geo = null;
    if (!list.length || !ax) return;
    const left=62, right=68, top=22, bottom=50, pw=w-left-right, ph=h-top-bottom;
    const vS = niceStep(ax.v, 8), rS = niceStep(ax.r, 12), fS = niceStep(ax.f, 12);
    const vMax = Math.max(vS, Math.ceil(ax.v/vS - 1e-9)*vS), rMax = Math.max(rS, Math.ceil(ax.r/rS - 1e-9)*rS), fMax = Math.max(fS, Math.ceil(ax.f/fS - 1e-9)*fS);
    const V = cv._view || {z:1, ox:0, oy:0}, Z = V.z;   // wheel zoom: visible window = [o, o + 1/Z] (normalised 0..1)
    const vT = niceStep(ax.v/Z, 8), rT = niceStep(ax.r/Z, 12), fT = niceStep(ax.f/Z, 12);   // tick steps follow the visible range
    const vLo = V.ox*vMax, vHi = (V.ox + 1/Z)*vMax, rLo = V.oy*rMax, rHi = (V.oy + 1/Z)*rMax, fLo = V.oy*fMax, fHi = (V.oy + 1/Z)*fMax;
    const X = v => left + (v/vMax - V.ox)*Z*pw, YF = f => top+ph - (f/fMax - V.oy)*Z*ph, YR = r => top+ph - (r/rMax - V.oy)*Z*ph;
    cv._geo = {left, top, pw, ph, vMax, rMax, fMax, items:list, z:Z, ox:V.ox, oy:V.oy};
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const axis = dark ? "#cbd5e1" : "#596579", grid = dark ? "#374151" : "#e1e6ed", txt = dark ? "#f3f4f6" : "#17202a";

    c.lineWidth = 1; c.font = "12px system-ui,sans-serif";
    for (let i=Math.ceil(fLo/fT - 1e-9); i*fT <= fHi + fT*1e-6; i++) {   // left axis: traction (with grid)
      const f = i*fT, y = YF(f);
      c.strokeStyle = grid; c.beginPath(); c.moveTo(left,y); c.lineTo(left+pw,y); c.stroke();
      c.fillStyle = axis; c.textAlign = "right"; c.textBaseline = "middle"; c.fillText(f.toFixed(decOf(fT)), left-8, y);
    }
    for (let i=Math.ceil(rLo/rT - 1e-9); i*rT <= rHi + rT*1e-6; i++) {   // right axis: RPM
      const r = i*rT, y = YR(r);
      c.strokeStyle = axis; c.beginPath(); c.moveTo(left+pw,y); c.lineTo(left+pw+4,y); c.stroke();
      c.fillStyle = axis; c.textAlign = "left"; c.textBaseline = "middle"; c.fillText(r.toFixed(decOf(rT)), left+pw+8, y);
    }
    for (let i=Math.ceil(vLo/vT - 1e-9); i*vT <= vHi + vT*1e-6; i++) {   // x axis: speed
      const v = i*vT, x = X(v);
      c.strokeStyle = grid; c.beginPath(); c.moveTo(x,top); c.lineTo(x,top+ph); c.stroke();
      c.fillStyle = axis; c.textAlign = "center"; c.textBaseline = "top"; c.fillText(v.toFixed(decOf(vT)), x, top+ph+8);
    }
    c.strokeStyle = axis; c.strokeRect(left, top, pw, ph);
    c.fillStyle = txt; c.font = "13px system-ui,sans-serif"; c.textAlign = "center"; c.textBaseline = "alphabetic";
    c.fillText(tr("pAxisX"), left+pw/2, h-8);
    c.save(); c.translate(15, top+ph/2); c.rotate(-Math.PI/2); c.fillText(tr("pAxisF"), 0, 0); c.restore();
    c.save(); c.translate(w-13, top+ph/2); c.rotate(Math.PI/2); c.fillText(tr("pAxisR"), 0, 0); c.restore();

    c.save(); c.beginPath(); c.rect(left, top, pw, ph); c.clip();
    list.forEach(res => {
    if (showDrag.checked && res.drag) {                                 // resistance lines by slope (all grey)
      c.strokeStyle = "#8a8f98"; c.fillStyle = "#8a8f98"; c.lineWidth = 1.2;
      c.font = "11px system-ui,sans-serif"; c.textAlign = "right"; c.textBaseline = "bottom";
      res.drag.forEach(d => {
        if (d.f > fHi) return;
        c.beginPath();
        for (let j=0; j<=80; j++) { const vk = vLo + (vHi - vLo)*j/80, x = X(vk), y = YF(d.f + d.q*Math.pow(vk/3.6, 2)); j ? c.lineTo(x,y) : c.moveTo(x,y); }
        c.stroke();
        c.fillText(d.s + "%", left+pw-3, YF(d.f + d.q*Math.pow(vHi/3.6, 2))-2);
      });
    }
    res.gs.forEach((g, i) => {
      const col = gearColor(i, nc);
      if (showLines.checked) {                                          // gear lines: 0 RPM up to the axis edge (dashed)
        const er = Math.min(rMax, vMax/g.k), ex = X(g.k*er), ey = YR(er);
        c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([8,5]);
        c.beginPath(); c.moveTo(X(0), YR(0)); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
        c.fillStyle = col; c.font = "bold 12px system-ui,sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        const rEnd = Math.min(er, rHi, vHi/g.k), rBeg = Math.max(rLo, vLo/g.k);   // part of the line inside the visible window
        if (rEnd >= rBeg) c.fillText(g.n, Math.min(left+pw-8, Math.max(left+8, X(g.k*rEnd)-8)), Math.max(top+10, YR(rEnd)-10));
      }
      if (showCurves.checked) {                                         // traction curves (solid) + peak dot
        c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath();
        g.data.forEach((p, j) => { const x = X(p.v), y = YF(p.f); j ? c.lineTo(x,y) : c.moveTo(x,y); });
        c.stroke();
        c.fillStyle = col; c.beginPath(); c.arc(X(g.pk.v), YF(g.pk.f), 4.5, 0, Math.PI*2); c.fill();
        const nx = res.gs[i+1];                                         // link line: right end -> next gear's curve
        if (!nx) {                                                        // last gear: down to the bottom of the graph
          const e = g.data[g.data.length-1];
          c.strokeStyle = "#b5bac3"; c.lineWidth = 1.3; c.setLineDash([4,4]);
          c.beginPath(); c.moveTo(X(e.v), YF(e.f)); c.lineTo(X(e.v), YF(0)); c.stroke(); c.setLineDash([]);
        } else if (nx.g < g.g) {
          const end = g.data[g.data.length-1];
          const rpmEq = Math.max(res.minRpm, end.v / nx.k);             // RPM right after the upshift
          const N = nx.data.length-1, u = (rpmEq - res.minRpm)/(res.rpm - res.minRpm)*N, j0 = Math.min(N-1, Math.floor(u)), fr = u - j0;
          const fN = nx.data[j0].f*(1-fr) + nx.data[j0+1].f*fr;
          c.strokeStyle = "#b5bac3"; c.lineWidth = 1.3; c.setLineDash([4,4]);
          c.beginPath(); c.moveTo(X(end.v), YF(end.f)); c.lineTo(X(end.v), YF(fN)); c.stroke(); c.setLineDash([]);
        }
      }
    });
    if (showPCurve.checked) {                                           // constant-power curve: F = P / v
      const vLow = Math.max(3.6*res.pW/(1000*fMax), vMax*0.002);
      if (vLow < vMax) {
        c.strokeStyle = txt; c.lineWidth = 1.5; c.beginPath();
        for (let k=0; k<=240; k++) {
          const v = vLow*Math.pow(vMax/vLow, k/240), x = X(v), y = YF(3.6*res.pW/(1000*v));
          k ? c.lineTo(x,y) : c.moveTo(x,y);
        }
        c.stroke();
      }
    }
    });
    c.restore();
  }

  function updatePerf() {
    updateAcc();
    $("matInfo").textContent = tr("matInfo").replace("{t}", MATS[matSel.value].track).replace("{w}", MATS[matSel.value].wheel).replace("{k}", MATS[matSel.value].rk.toExponential(1).replace("e-", "e-"));
    if ($("tab-perf").hidden) return;
    const res = [0,1].map(calcPerf);
    $("pError").textContent = res.map((r,i) => r && r.error ? `${tr("pVehicle")} ${i+1}: ${r.error}` : "").filter(Boolean).join(" ");
    const ok = res.map(r => r && !r.error ? r : null), valid = ok.filter(Boolean);
    const overlay = showOverlay.checked && valid.length > 1;
    $("pCharts").classList.toggle("two", valid.length > 1 && !overlay);
    $("pCharts").classList.toggle("overlay", overlay);
    [0,1].forEach(i => { $("pPanel"+i).hidden = !ok[i]; });
    // Shared axes so that the two charts are directly comparable
    const nc = Math.max(0, ...valid.map(r => r.gs.length));
    const ax = valid.length ? {
      v: Math.max(...valid.flatMap(r => r.gs.map(g => g.vmax)))*1.1,
      r: Math.max(...valid.map(r => r.rpm))*1.1,
      f: Math.max(...valid.flatMap(r => r.gs.map(g => g.pk.f)))*1.1
    } : null;
    [0,1].forEach(i => {
      const r = ok[i];
      const pn = (q,k) => q.vname || q.ename || `${tr("pVehicle")} ${k+1}`;
      $("pHead"+i).innerHTML = r
        ? `<div class="vn">${esc(overlay && i === 0 ? ok.map((q,k) => q && pn(q,k)).filter(Boolean).join(" VS ") : pn(r,i))}</div>${r.vname && r.ename ? `<div class="muted">${tr("engine")}: ${esc(r.ename)}${r.usedDefault ? ` ${tr("statusDefault")}` : ""}</div>` : ""}`
        : "";
      drawPerf($("pChart"+i), overlay ? (i === 0 ? valid : []) : (r ? [r] : []), ax, nc);
      $("pLegend"+i).innerHTML = r ? r.gs.map((g,gi) =>
        `<span style="color:${gearColor(gi,nc)}"><i class="line-key"></i><i class="line-key dashed"></i>${gearName(g.n)} (${fmtNum(g.g)})</span>`).join("") + (showPCurve.checked ? `<span style="color:var(--text)"><i class="line-key"></i>${tr("pCurveName")}</span>` : "") + (showDrag.checked && r.drag ? `<span style="color:#8a8f98"><i class="line-key"></i>${tr("pDragName")}</span>` : "") : "";
      $("pResults"+i).innerHTML = r ? r.gs.map((g,gi) => `
        <div class="result">
          <strong><i class="swatch" style="background:${gearColor(gi,nc)}"></i>${gearName(g.n)}</strong>
          <small>${tr("pTotal")} ${g.tot.toFixed(3)} (${fmtNum(g.g)} × ${fmtNum(g.tot/g.g)})</small>
          <small>${tr("pVmax")} ${g.vmax.toFixed(1)} km/h (${Math.round(r.rpm)} RPM)</small>
          <small>${tr("pFmax")} ${g.pk.f.toFixed(1)} kN (${Math.round(g.pk.rpm)} RPM / ${g.pk.v.toFixed(1)} km/h)</small>
          ${g.climb != null ? `<small>${tr("pClimb")} ${g.climb < 0 ? tr("pNoClimb") : `${(Math.tan(g.climb)*100).toFixed(1)}% (${(g.climb*180/Math.PI).toFixed(1)}°)`}</small>` : ""}
        </div>`).join("") : "";
    });
  }

  // ---- Crosshair (all charts) and tooltip (performance charts) ----
  // Charts passed together to linkCross() mirror each other: hovering one shows the guide lines (and tooltip) on all.
  // o.inTip(g,u,ry): tooltip while the cursor is inside the plot (hovered chart only; reads the axis values at the cursor)
  // o.axisTip(g,u):   tooltip while the cursor is in the x-axis area below the plot (vertical line only; shown on every linked chart)
  function makeCross(cv, o) {
    const wrap = cv.parentElement;
    const vl = document.createElement("div"), hl = document.createElement("div"), tip = document.createElement("div");
    vl.className = "xh xv"; hl.className = "xh xhz"; tip.className = "chart-tip";
    wrap.append(vl, hl, tip);
    const hide = () => { vl.style.display = hl.style.display = tip.style.display = "none"; };
    hide();
    // mode: "in" | "axis"; u, w: position inside the plot area, 0..1 (left->right, top->bottom)
    const show = (mode, u, w, hovered) => {
      const g = cv._geo, rect = cv.getBoundingClientRect();
      if (!g || rect.width < 10) return hide();
      vl.style.cssText = `display:block;left:${g.left + u*g.pw}px;top:${g.top}px;height:${g.ph}px`;
      if (mode === "in") hl.style.cssText = `display:block;top:${g.top + w*g.ph}px;left:${g.left}px;width:${g.pw}px`;
      else hl.style.display = "none";
      const ud = g.ox + u/g.z, wd = g.oy + (1 - w)/g.z;   // position in the (zoomed) data window, normalised 0..1 (y from the bottom)
      const html = mode === "in" ? (hovered && o.inTip ? o.inTip(g, ud, wd) : "") : (o.axisTip ? o.axisTip(g, ud) : "");
      if (!html) { tip.style.display = "none"; return; }
      tip.innerHTML = html;
      tip.style.cssText = o.pos === "bottom"
        ? `display:block;bottom:${rect.height-g.top-g.ph+8}px;right:${rect.width-g.left-g.pw+8}px`
        : `display:block;top:${g.top+8}px;right:${rect.width-g.left-g.pw+8}px`;
    };
    return {cv, hide, show, hasAxis: !!o.axisTip};
  }
  // Charts passed together mirror each other: hovering one shows the guide lines on all.
  function linkCross(list) {
    list.forEach(me => {
      me.cv.addEventListener("pointermove", e => {
        const g = me.cv._geo;
        if (!g) return list.forEach(o => o.hide());
        const rect = me.cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
        const inX = x >= g.left && x <= g.left+g.pw;
        const mode = !inX ? null : (y >= g.top && y <= g.top+g.ph) ? "in" : (y > g.top+g.ph && me.hasAxis) ? "axis" : null;
        if (!mode) return list.forEach(o => o.hide());
        const u = (x - g.left)/g.pw, w = (y - g.top)/g.ph;
        list.forEach(o => o.show(mode, u, w, o === me));
      });
      me.cv.addEventListener("pointerleave", () => list.forEach(o => o.hide()));
    });
  }
  const row = (a, b) => `<div><span>${a}</span><b>${b}</b></div>`;
  const vehName = r => r.vname || r.ename || `${tr("pVehicle")} ${r.idx+1}`;

  // ---- performance charts ----
  // inside the plot: speed / traction / RPM read off the axes at the cursor
  const perfInTip = (g, u, ry) =>
    row(tr("tipSpeed"), `${(u*g.vMax).toFixed(1)} km/h`) + row(tr("tipForce"), `${(ry*g.fMax).toFixed(1)} kN`) + row(tr("tipRpm"), `${Math.round(ry*g.rMax)} RPM`);
  // speed axis area: the strongest traction curve (highest on the chart) that the vertical line touches
  const perfAxisTip = (g, u) => {
    if (!showCurves.checked) return "";
    const v = u*g.vMax, items = g.items || [];
    let best = null;
    items.forEach(res => res.gs.forEach(gr => {
      const d = gr.data;
      if (v < d[0].v - 1e-9 || v > d[d.length-1].v + 1e-9) return;
      const j = Math.max(1, d.findIndex(p => p.v >= v)), p = d[j-1], q = d[j];
      const k = q.v > p.v ? Math.min(1, Math.max(0, (v - p.v)/(q.v - p.v))) : 0;
      const f = p.f + (q.f - p.f)*k;
      if (!best || f > best.f) best = {f, rpm: p.rpm + (q.rpm - p.rpm)*k, res, gr};
    }));
    let html = row(tr("tipSpeed"), `${v.toFixed(1)} km/h`);

    html += items.length > 1 ? row(esc(vehName(best.res)), gearName(best.gr.n)) : row(tr("tipGear"), gearName(best.gr.n));

      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "zoom-reset";
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg>';
      const label = () => { btn.title = btn.ariaLabel = `${tr("zoomReset")} ×${V.z.toFixed(1)}`; };
      btn.addEventListener("pointerenter", label); label();
      btn.addEventListener("click", reset);
      cv.parentElement.appendChild(btn); btns.push(btn);
      cv.addEventListener("wheel", e => {
        const g = cv._geo; if (!g) return;
        const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
        const z0 = V.z; let z1 = Math.min(ZOOM_MAX, Math.max(1, z0*Math.exp(-dy*0.002)));
        if (z1 < 1.01) z1 = 1;
        e.preventDefault();                    // never scroll the page while the wheel is over a chart (at any zoom level)
        if (z1 === z0) return;
        const rect = cv.getBoundingClientRect();
        const u = Math.min(1, Math.max(0, (e.clientX - rect.left - g.left)/g.pw));        // cursor inside the plot, 0..1 (left -> right)
        const w = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top - g.top)/g.ph));      // 0..1 (bottom -> top)
        const px = V.ox + u/z0, py = V.oy + w/z0;                                         // data point under the cursor stays put
        V.z = z1; V.ox = Math.min(1 - 1/z1, Math.max(0, px - u/z1)); V.oy = Math.min(1 - 1/z1, Math.max(0, py - w/z1));
        redraw();
        cv.dispatchEvent(new PointerEvent("pointermove", {clientX:e.clientX, clientY:e.clientY, bubbles:true}));   // refresh crosshair / tooltip
      }, {passive:false});
      // drag to pan while zoomed (the content follows the cursor)
      cv.addEventListener("pointerdown", e => {
        if (e.button !== 0 || V.z <= 1 || !cv._geo) return;
        drag = {id:e.pointerId, x:e.clientX, y:e.clientY};
        cv.setPointerCapture(e.pointerId); sync();
      });
      cv.addEventListener("pointermove", e => {
        if (!drag || drag.id !== e.pointerId || !e.isTrusted) return;
        const g = cv._geo; if (!g) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
        V.ox = Math.min(1 - 1/V.z, Math.max(0, V.ox - dx/(g.pw*V.z)));
        V.oy = Math.min(1 - 1/V.z, Math.max(0, V.oy + dy/(g.ph*V.z)));
        redraw();
        cv.dispatchEvent(new PointerEvent("pointermove", {clientX:e.clientX, clientY:e.clientY, bubbles:true}));   // refresh crosshair / tooltip
      });
      const endDrag = e => { if (drag && drag.id === e.pointerId) { drag = null; sync(); } };
      cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
    });
  }
  setupZoom(["chart0", "chart1"]); setupZoom(["pChart0", "pChart1"]); setupZoom(["aV0", "aV1"]);

  // ---- Tabs ----
  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
    ["torque","perf","acc"].forEach(t => { $("tab-"+t).hidden = t !== btn.dataset.tab; });
    refresh();
  }));

  const helpModal = $("helpModal");
  const closeHelp = () => { helpModal.hidden = true; };
  $("helpBtn").addEventListener("click", () => { helpModal.hidden = false; });
  $("helpClose").addEventListener("click", closeHelp);
  helpModal.addEventListener("click", e => { if (e.target === helpModal) closeHelp(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeHelp(); });
  $("language").addEventListener("change", e => { language = e.target.value; applyLanguage(); });
  powerUnit.addEventListener("change", refresh);
  matSel.addEventListener("change", refresh);
  showTorque.addEventListener("change", update);
  $("eOverlay").addEventListener("change", update);
  showPower.addEventListener("change", update);
  absAxis.addEventListener("change", update);
  $("reset").addEventListener("click", () => pCards.forEach(c => c.querySelector(".pClear").click()));
  window.addEventListener("resize", refresh);

  // =====================================================================
  // Share URL: encodes the input-field values (NOT the pasted BLK text) into location.hash (#s=...)
  // =====================================================================
  const SHARE_BOOLS = ["showCurves","showLines","showPCurve","showOverlay","showDrag","eOverlay","showTorque","showPower","absAxis","aOverlay","aShowV","aShowD"];
  const TABS = ["torque","perf","acc"];
  const b64e = str => btoa(Array.from(new TextEncoder().encode(str), b => String.fromCharCode(b)).join("")).replaceAll("+","-").replaceAll("/","_").replace(/=+$/,"");
  const b64d = str => { const t = str.replaceAll("-","+").replaceAll("_","/"); const bin = atob(t + "=".repeat((4 - t.length % 4) % 4)); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); };
  const activeTab = () => { const b = document.querySelector(".tab.active"); return b ? b.dataset.tab : "torque"; };

  function collectShare() {
    const cards = [0,1].map(i => { const v = PFK.map(k => pfField(i,k).value); return v.every(x => x === "") ? null : v; });
    if (cards.every(c => c === null)) return "";
    const st = {
      n:1, l:language, u:powerUnit.value, m:matSel.value, t:activeTab(),
      c:cards, p:pPhys.map(x => x || ""),
      f:SHARE_BOOLS.map(id => $(id) && $(id).checked ? "1" : "0").join(""),
      s:aSlope.value, g:$("accLag").value
    };
    return b64e(JSON.stringify(st));
  }
  const shareUrl = () => { const c = collectShare(); return location.href.split("#")[0] + (c ? "#s=" + c : ""); };

  function applyShare(code) {
    let st;
    try { st = JSON.parse(b64d(code)); } catch { return false; }
    if (!st || typeof st !== "object" || !Array.isArray(st.c)) return false;
    const str = v => (typeof v === "string" ? v.slice(0, 2000) : "");
    if (st.l === "ja" || st.l === "en") { language = st.l; $("language").value = language; }
    if (["hp","ps","kw"].includes(st.u)) powerUnit.value = st.u;
    if (st.m in MATS) matSel.value = st.m;
    [0,1].forEach(i => {
      const c = st.c[i];
      if (!Array.isArray(c)) return;
      PFK.forEach((k, n) => { pfField(i,k).value = str(c[n]); });
      pPhys[i] = str(Array.isArray(st.p) ? st.p[i] : "");
      const label = str(c[0]) || str(c[1]);
      pfStat[i] = {fn: () => `${tr("statusShared")}${label}`, cls: "ok"};
      renderPfStat(i);
    });
    if (typeof st.f === "string") SHARE_BOOLS.forEach((id, n) => { if ($(id) && st.f[n] !== undefined) $(id).checked = st.f[n] === "1"; });
    if ([...aSlope.options].some(o => o.value === String(st.s))) aSlope.value = String(st.s);
    if (st.g !== undefined && Number.isFinite(Number(st.g))) $("accLag").value = String(st.g);
    if (TABS.includes(st.t)) {
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === st.t));
      TABS.forEach(t => { $("tab-"+t).hidden = t !== st.t; });
    }
    return true;
  }
  function loadShared() {
    const m = /^#s=([A-Za-z0-9_-]+)$/.exec(location.hash);
    return m ? applyShare(m[1]) : false;
  }
  let shareTimer = null;
  function syncHash() {
    clearTimeout(shareTimer);
    shareTimer = setTimeout(() => {
      try { history.replaceState(null, "", shareUrl()); } catch { /* e.g. sandboxed frame: ignore */ }
    }, 400);
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch { /* fall through */ }
    try {
      const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch { return false; }
  }
  $("shareBtn").addEventListener("click", async () => {
    const url = shareUrl(), b = $("shareBtn");
    if (await copyText(url)) { b.textContent = tr("shareCopied"); setTimeout(() => { b.innerHTML = tr("share"); }, 1500); }
    else window.prompt(tr("share"), url);
  });
  $("shareBtn").title = "";
  document.addEventListener("input", syncHash);
  document.addEventListener("change", syncHash);
  document.addEventListener("click", e => { if (e.target.closest && e.target.closest(".tab, .pClear, #reset")) syncHash(); });
  window.addEventListener("hashchange", () => { if (loadShared()) applyLanguage(); });
  loadShared();

  $("language").value = language;
  applyLanguage();
})();
</script>
</body>
</html>
